<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- Arcane Ascension's landing page moved to its own domain. GitHub Pages
       cannot send a server 301, so this page is the redirect: meta refresh
       for every browser, location.replace for those running scripts (no
       history entry), rel=canonical so search engines credit the new URL,
       noindex so this stub never ranks, and a link for anything else.
       The new site answers the old paths too: arcane-ascension.com's
       _redirects 301s /arcane-ascension/* to their new homes. -->
  <meta http-equiv="refresh" content="0; url=https://arcane-ascension.com/">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcane Ascension has moved</title>
  <link rel="canonical" href="https://arcane-ascension.com/">
  <script>location.replace('https://arcane-ascension.com/' + location.search + location.hash);</script>
  <style>
    body {
      margin: 0;
      padding: 3rem 1.25rem;
      background: #15131F;
      color: #ECE8FF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      line-height: 1.6;
    }

    a {
      color: #F2C14E;
    }
  </style>
</head>

<body>
  <p>Arcane Ascension has moved to
    <a href="https://arcane-ascension.com/">arcane-ascension.com</a>.</p>
</body>

</html>
